<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    

<section id="contact" class="page">
    <h2 class="title">اتصل بي</h2>
    <p class="sub">يسعدني تواصلكم لأي استفسار أو عرض عمل</p>
    <form class="contact-form" id="contact-form">
      <div class="field">
        <label>الاسم</label>
        <input type="text" required placeholder="اسمك الكامل">
      </div>
      <div class="field">
        <label>البريد الإلكتروني</label>
        <input type="email" required placeholder="example@email.com">
      </div>
      <div class="field">
        <label>الموضوع</label>
        <input type="text" required placeholder="موضوع الرسالة">
      </div>
      <div class="field">
        <label>الرسالة</label>
        <textarea rows="5" required placeholder="اكتب رسالتك هنا..."></textarea>
      </div>
      <button type="submit" class="submit">إرسال</button>
    
    </form>
  </section>
















</body>
</html>
